<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMSC471 Assignment 1</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
      <div id="crime-controls">
        <label for="crime-type-filter">Crime Type:</label>
        <select id="crime-type-filter"></select>

        <label for="arrest-filter">Arrest Status:</label>
        <select id="arrest-filter">
            <option value="All">All</option>
            <option value="true">Arrested</option>
            <option value="false">Not Arrested</option>
        </select>
      </div>
      <div id="year-brush">
        <p>
          Selected Year Range:
          <span id="selected-year-range">All years</span>
        </p>
      </div>
      
      <svg class="chart"></svg>
    </div>
    

    <div id="tooltip" style="display:none"></div> 

    <!-- Load D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-simple-slider"></script>
    <script src="js/script.js"></script>

    
</body>
</html>
