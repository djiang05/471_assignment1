
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chicago Crime Arrests by District</title>

    <!-- Bootstrap styling -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Custom styling -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>

  <body>
    <div class="container">
      <h1>Chicago Crime Arrests by District</h1>

      <p class="description">
        The graph below shows the number of arrests reported in each police
        district from 2001-present. Click on any district for a more detailed analysis 
        of the number of arrests made each year.
      </p>

<div class="filters">
  <label for="minArrests">Minimum arrests:</label>
  <input
    type="number"
    id="minArrests"
    min="0"
    value="0"
  />

  <button id="resetFilters" type="button">
    Reset filters
  </button>
</div>

<div id="filterStatus" aria-live="polite"></div>

<button id="backButton" type="button" style="display: none;">
  ← Back to all districts
</button>

      <!-- Holds the D3 bar chart -->
      <div id="vis"></div>
    </div>

    <!-- Your visualization code -->
    <script src="js/script.js"></script>
    <script src="https://unpkg.com/d3-simple-slider"></script>
  </body>
</html>
