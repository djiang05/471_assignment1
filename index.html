
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chicago Crime Arrests by District</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>

  <body>
    <div class="container">
      <h1>Chicago Crime Arrests by District</h1>

      <p class="description">
        The graph below shows the number of arrests reported in each police
        district from 2001-present. Click on any district for a more detailed analysis
        of the number of arrests made each year.
      </p>

      <div class="filters">
        <label for="minArrests">Minimum arrests:</label>
        <input
          type="number"
          id="minArrests"
          min="0"
          value="0"
        />

      </div>

      <div id="filterStatus" aria-live="polite"></div>

      <button id="backButton" type="button" style="display: none;">
        ← Back to all districts
      </button>

      <div id="crime-controls">
        <label for="crime-type-filter">Crime Type:</label>
        <select id="crime-type-filter"></select>

        <label for="arrest-filter">Arrest Status:</label>
        <select id="arrest-filter">
          <option value="All">All</option>
          <option value="true">Arrested</option>
          <option value="false">Not Arrested</option>
        </select>
      </div>

      <div id="year-brush">
        <p>
          Selected Year Range:
          <span id="selected-year-range">All years</span>
        </p>
      </div>

      <button id="resetFilters" type="button">
        Reset All Filters
      </button>

      <div id="vis"></div>

      <svg class="map"></svg>
    </div>

    <script src="https://unpkg.com/d3-simple-slider"></script>
    <script src="js/script.js"></script>
  </body>
</html>
